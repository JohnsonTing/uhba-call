<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UHBA 商機日 · 試打電話</title>
<meta name="description" content="留低電話，UHBA 嘅 AI 助理 May 即刻打俾你。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single centred card on a harbour-night ground, phone-first. */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#16232B; --muted:#5B6A72; --line:#D9DDD8;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --signal:#C8372D; --ok:#0E6B5C;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1A1F; --surface:#16252C; --ink:#EAF0EE; --muted:#9AAAB0; --line:#2A3A41;
  --accent:#3FB59E; --accent-ink:#06211B; --signal:#F07A6E; --ok:#3FB59E; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(32px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:900 clamp(30px,8vw,40px)/1.15 var(--display);margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lede{margin:0;color:var(--muted)}
.lede b{color:var(--ink);font-weight:700}
.event{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:14px 0;border-block:1px solid var(--line);font-size:15px}
.event dt{font:500 12px/1.9 var(--mono);color:var(--muted);letter-spacing:.06em}
.event dd{margin:0}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
label small{color:var(--muted);font-weight:400}
input[type=text],input[type=tel]{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input[type=tel]{font-family:var(--mono);letter-spacing:.04em}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.consent{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;color:var(--muted)}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{font:700 18px/1 var(--body);padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
button[disabled]{opacity:.55;cursor:default}
.status{margin:0;font-size:15px;min-height:1.6em}
.status.ok{color:var(--ok);font-weight:700}
.status.err{color:var(--signal)}
.ring{width:10px;height:10px;border-radius:50%;background:currentColor;display:none}
button.busy .ring{display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){button.busy .ring{animation:none}}
footer{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main>
  <p class="eyebrow">UHBA · Phoenix Business Connect Day</p>
  <h1>留低電話，<span>May</span> 即刻打俾你</h1>
  <p class="lede">May 係 UHBA 嘅 <b>AI 電話助理</b>，用廣東話提你出席活動、答你問題。試吓同佢傾兩句。</p>

  <dl class="event">
    <dt>日期</dt><dd>10月22號（星期四）下晝 1:30 – 4:00</dd>
    <dt>地點</dt><dd>iFAST Global Bank，77 Marsh Wall，E14 9SH</dd>
  </dl>

  <form id="f" novalidate>
    <label for="name">你個名 <small>（May 會用嚟稱呼你）</small>
      <input id="name" name="name" type="text" autocomplete="given-name" maxlength="40" placeholder="例如：陳大文">
    </label>
    <label for="phone">英國手機號碼
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07xxx xxxxxx" required>
    </label>
    <label class="hp" aria-hidden="true">Website <input id="website" name="website" tabindex="-1" autocomplete="off"></label>
    <label class="consent" for="consent">
      <input id="consent" type="checkbox">
      我同意 UHBA 嘅 AI 助理而家打呢個號碼俾我，通話可能會錄音作改善用途。
    </label>
    <button id="go" type="submit"><span class="ring" aria-hidden="true"></span><span id="go-label">打俾我</span></button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>

  <footer>只限英國手機號碼。</footer>
</main>
<script>
// Apps Script web app URL (set after deployment). No secrets live in this page.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyeU3TXbVHiS5t3excjt27p9ZLXkTunDIUYXTJJ3d6yrcgXguLLhDc_N82LdVF9y4u3/exec";

const f = document.getElementById("f");
const btn = document.getElementById("go");
const label = document.getElementById("go-label");
const statusEl = document.getElementById("status");

const MSG = {
  invalid_phone: "請輸入有效嘅英國手機號碼（07 開頭，11 個字）。",
  consent_required: "請剔選同意，May 先可以打俾你。",
  daily_cap: "今日試打嘅名額已滿，聽日再試。",
  not_configured: "系統仲未設定好，請稍後再試。",
  call_failed: "打唔通，請檢查號碼再試。",
  network: "網絡有問題，請再試一次。"
};

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function validUk(raw) {
  let s = String(raw || "").replace(/[\s\-().]/g, "");
  if (s.startsWith("00")) s = "+" + s.slice(2);
  if (s.startsWith("07")) s = "+44" + s.slice(1);
  if (s.startsWith("447")) s = "+" + s;
  return /^\+447\d{9}$/.test(s);
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const phone = document.getElementById("phone").value;
  const consent = document.getElementById("consent").checked;
  if (!validUk(phone)) return setStatus(MSG.invalid_phone, "err");
  if (!consent) return setStatus(MSG.consent_required, "err");
  if (!ENDPOINT) return setStatus(MSG.not_configured, "err");

  btn.disabled = true; btn.classList.add("busy"); label.textContent = "撥緊號…";
  setStatus("");
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        phone, consent,
        website: document.getElementById("website").value
      })
    });
    const data = await res.json();
    if (data.ok) {
      setStatus("搞掂！May 而家打緊俾你，留意電話。", "ok");
      label.textContent = "已經打出";
      return;
    }
    setStatus(MSG[data.error] || MSG.call_failed, "err");
  } catch (err) {
    setStatus(MSG.network, "err");
  }
  btn.disabled = false; btn.classList.remove("busy"); label.textContent = "打俾我";
});
</script>
</body>
</html>
